<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .leaf { animation: sway 3.2s ease-in-out infinite alternate; transform-origin: bottom center; }
    .leaf:nth-child(2n) { animation-delay: -1s; }
    .cat-tail { animation: tail 2.2s ease-in-out infinite alternate; transform-origin: 948px 159px; }
    .star { animation: blink 2.6s ease-in-out infinite; }
    @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
    @keyframes tail { from { transform: rotate(-8deg); } to { transform: rotate(12deg); } }
    @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  </style>
  <rect width="1200" height="240" rx="22" fill="#172A3A"/>
  <circle class="star" cx="160" cy="52" r="4" fill="#F4D35E"/>
  <circle class="star" cx="1030" cy="72" r="3" fill="#B8F2E6"/>
