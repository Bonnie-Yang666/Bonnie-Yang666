<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; }
    .path { stroke-dasharray: 14 18; animation: crawl 8s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; }
    .dot.two { animation-delay:.55s; }
    .dot.three { animation-delay:1.1s; }
    @keyframes crawl { to { stroke-dashoffset: -160; } }
    @keyframes pulse { 0%,100% { transform: scale(.92); opacity:.7; } 50% { transform: scale(1.08); opacity:1; } }
  </style>
  <rect width="1200" height="210" rx="18" fill="#FBF8EF"/>
  <text x="60" y="55" font-size="24" font-weight="700" fill="#264653">Activity trail</text>
  <text x="60" y="84" font-size="15" fill="#5C6863">A living little map for commits, experiments, and ideas in motion.</text>
  <path class="path" d="M76 145C190 88 278 174 386 129C495 84 576 100 650 137C742 182 824 130 914 111C1010 91 1072 126 1126 82" stroke="#2A9D8F" stroke-width="8" stroke-linecap="round"/>
  <g class="dot" fill="#E76F51">
    <circle cx="76" cy="145" r="14"/>
    <text x="76" y="181" text-anchor="middle" font-size="13" fill="#38524A">ideas</text>
  </g>
  <g class="dot two" fill="#E9C46A">
    <circle cx="386" cy="129" r="14"/>
    <text x="386" y="181" text-anchor="middle" font-size="13" fill="#38524A">build</text>
  </g>
  <g class="dot three" fill="#6A994E">
    <circle cx="650" cy="137" r="14"/>
    <text x="650" y="181" text-anchor="middle" font-size="13" fill="#38524A">learn</text>
  </g>
  <g class="dot two" fill="#457B9D">
    <circle cx="914" cy="111" r="14"/>
    <text x="914" y="181" text-anchor="middle" font-size="13" fill="#38524A">share</text>
  </g>
  <g class="dot" fill="#F4A261">
    <circle cx="1126" cy="82" r="14"/>
    <text x="1126" y="181" text-anchor="middle" font-size="13" fill="#38524A">grow</text>
  </g>
</svg>
